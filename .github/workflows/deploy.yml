name: React CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: react-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: |
          if npm pkg get scripts.lint | grep -qv null; then
            npm run lint
          fi

      - name: Run tests
        run: |
          if npm pkg get scripts.test | grep -qv null; then
            npm test -- --run
          fi

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist
          if-no-files-found: error
          retention-days: 7
